<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>하루조각 피드 시안 C</title>
  <style>
    :root {
      --page: #0e1120;
      --ivory: #161a2b;
      --card: #20263b;
      --line: #2e3550;
      --ink: #ece8df;
      --ink-soft: #9097b0;
      --accent: #f2c76e;
      --accent-soft: rgba(242, 199, 110, 0.16);
      --shadow: 0 8px 24px rgba(0, 0, 0, 0.28);
      --radius-card: 30px;
      --radius-photo: 24px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding: 32px 16px;
      background: var(--page);
      color: var(--ink);
      font-family: ui-rounded, "SF Pro Rounded", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    button { font-family: inherit; }

    /* 휴대폰 화면 */
    .phone {
      width: 100%;
      max-width: 430px;
      background: var(--ivory);
      border-radius: 48px;
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.5), 0 0 0 1px var(--line);
      overflow: hidden;
    }

    @media (max-width: 460px) {
      body { padding: 0; }
      .phone { border-radius: 0; box-shadow: none; min-height: 100vh; }
    }

    /* 상단 */
    .header {
      position: sticky;
      top: 0;
      z-index: 2;
      padding: 24px 18px 12px;
      background: rgba(22, 26, 43, 0.9);
      backdrop-filter: blur(10px);
    }
    .header h1 {
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.3px;
    }
    .header h1 span { color: var(--accent); }
    .header p {
      margin-top: 2px;
      font-size: 13px;
      color: var(--ink-soft);
    }

    /* 피드 */
    .feed {
      display: flex;
      flex-direction: column;
      gap: 12px;
      padding: 8px 10px 6px;
    }

    .card {
      background: var(--card);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow);
      padding: 10px 10px 16px;
    }

    .card-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 10px;
      padding: 4px 6px 0;
    }
    .avatar {
      width: 36px;
      height: 36px;
      border-radius: 14px;
      display: grid;
      place-items: center;
      background: var(--accent-soft);
      color: var(--accent);
      font-weight: 800;
      font-size: 15px;
      flex-shrink: 0;
    }
    .who { flex: 1; min-width: 0; }
    .author { font-size: 15px; font-weight: 700; }
    .time { font-size: 12px; color: var(--ink-soft); margin-top: 1px; }
    .more {
      border: 0;
      background: none;
      color: var(--ink-soft);
      font-size: 18px;
      letter-spacing: 1px;
      padding: 4px 6px;
      cursor: pointer;
    }

    /* 사진 */
    .photo-wrap {
      position: relative;
      border-radius: var(--radius-photo);
      overflow: hidden;
      aspect-ratio: 1 / 1;
      background: var(--line);
    }
    .photo-wrap img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }
    .count-badge {
      position: absolute;
      top: 12px;
      right: 12px;
      padding: 5px 11px;
      border-radius: 999px;
      background: rgba(14, 17, 32, 0.6);
      backdrop-filter: blur(6px);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
    }
    .dots {
      display: flex;
      justify-content: center;
      gap: 6px;
      margin-top: 10px;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 999px;
      background: var(--line);
    }
    .dot.active {
      width: 7px;
      background: var(--accent);
      box-shadow: 0 0 8px rgba(242, 199, 110, 0.7);
    }

    /* 본문 */
    .content {
      margin-top: 10px;
      padding: 0 6px;
      font-size: 15px;
      line-height: 1.6;
      white-space: pre-line;
      word-break: keep-all;
    }
    .content.clamped {
      display: -webkit-box;
      -webkit-line-clamp: 3;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }
    .read-more {
      margin: 4px 6px 0;
      border: 0;
      background: none;
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      padding: 0;
    }

    /* 무한 스크롤 상태 (모양 보기용) */
    .states {
      display: flex;
      flex-direction: column;
      gap: 10px;
      padding: 6px 10px 36px;
    }
    .state-label {
      font-size: 11px;
      font-weight: 700;
      color: var(--ink-soft);
      letter-spacing: 0.5px;
      margin-bottom: 6px;
      padding-left: 10px;
    }
    .state {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      padding: 20px 16px;
      background: rgba(32, 38, 59, 0.5);
      border-radius: var(--radius-card);
      font-size: 14px;
      color: var(--ink-soft);
      text-align: center;
    }

    .spinner {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 3px solid var(--accent-soft);
      border-top-color: var(--accent);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    .end-line {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
    }
    .end-line::before,
    .end-line::after {
      content: "";
      flex: 1;
      height: 1px;
      background: var(--line);
    }
    .end-mark { color: var(--accent); font-size: 14px; }

    .state.error { color: var(--ink); }
    .retry {
      border: 0;
      border-radius: 999px;
      padding: 10px 22px;
      background: var(--accent);
      color: #1a1d2e;
      font-size: 14px;
      font-weight: 800;
      cursor: pointer;
    }
    .retry:active { transform: scale(0.96); }
  </style>
</head>
<body>
  <main class="phone">
    <header class="header">
      <h1>하루조각<span>.</span></h1>
      <p>사진 한 장으로 남기는 오늘의 조각</p>
    </header>

    <section class="feed" id="feed"></section>

    <section class="states">
      <div>
        <div class="state-label">상태 · 더 불러오는 중</div>
        <div class="state">
          <div class="spinner"></div>
          조각을 더 가져오고 있어요
        </div>
      </div>

      <div>
        <div class="state-label">상태 · 더 없음</div>
        <div class="state">
          <div class="end-line"><span class="end-mark">✦</span></div>
          모든 조각을 다 봤어요
        </div>
      </div>

      <div>
        <div class="state-label">상태 · 오류</div>
        <div class="state error">
          조각을 불러오지 못했어요.<br />다시 시도해 주세요
          <button class="retry" type="button">다시 시도</button>
        </div>
      </div>
    </section>
  </main>

  <script>
    const minutesAgo = (m) => new Date(Date.now() - m * 60 * 1000).toISOString();

    // docs/요구사항.md 의 게시물 항목과 같은 모양
    const posts = [
      {
        id: "p1",
        author: "서윤",
        content: "주말 아침 산책길. 빵집 들렀다가 강가까지 천천히 걸었다 🍞",
        images: [
          "https://picsum.photos/seed/morning/600/600",
          "https://picsum.photos/seed/bakery/600/600",
          "https://picsum.photos/seed/river/600/600",
          "https://picsum.photos/seed/sunset/600/600",
        ],
        created_at: minutesAgo(12),
      },
      {
        id: "p2",
        author: "민재",
        content: "오늘의 커피 ☕️ 창가 자리가 비어 있어서 운이 좋았던 날",
        images: ["https://picsum.photos/seed/coffee/600/600"],
        created_at: minutesAgo(180),
      },
      {
        id: "p3",
        author: "하린",
        content:
          "비 오는 날엔 괜히 오래된 노트를 꺼내 보게 된다. 작년 이맘때 적어 둔 문장들을 읽다 보니, 그땐 그렇게 커 보이던 고민들이 지금은 기억도 잘 나지 않는다는 게 신기했다.\n\n그래서 오늘도 사소한 걸 적어 두기로 했다. 따뜻한 차 한 잔, 창문에 맺힌 빗방울, 퇴근길에 들은 노래 한 곡. 일 년 뒤의 내가 이 조각들을 보면서 오늘을 조금 더 다정하게 기억해 주면 좋겠다.",
        images: ["https://picsum.photos/seed/rainyday/600/600"],
        created_at: minutesAgo(60 * 26),
      },
    ];

    function formatTime(iso) {
      const diff = (Date.now() - new Date(iso).getTime()) / 1000 / 60;
      if (diff < 1) return "방금 전";
      if (diff < 60) return `${Math.floor(diff)}분 전`;
      if (diff < 60 * 24) return `${Math.floor(diff / 60)}시간 전`;
      if (diff < 60 * 24 * 7) return `${Math.floor(diff / 60 / 24)}일 전`;
      const d = new Date(iso);
      return `${d.getFullYear()}.${d.getMonth() + 1}.${d.getDate()}`;
    }

    function el(tag, className, text) {
      const node = document.createElement(tag);
      if (className) node.className = className;
      if (text !== undefined) node.textContent = text;
      return node;
    }

    function renderPhotos(images) {
      const box = el("div");
      const wrap = el("div", "photo-wrap");
      const img = el("img");
      img.src = images[0];
      img.alt = "";
      img.loading = "lazy";
      wrap.append(img);
      box.append(wrap);

      // 사진 1장: 사진만 / 여러 장: 장수 배지 + 점
      if (images.length > 1) {
        wrap.append(el("span", "count-badge", `1/${images.length}`));
        const dots = el("div", "dots");
        images.forEach((_, i) => dots.append(el("span", i === 0 ? "dot active" : "dot")));
        box.append(dots);
      }
      return box;
    }

    function renderCard(post) {
      const card = el("article", "card");

      const head = el("div", "card-head");
      const who = el("div", "who");
      who.append(el("div", "author", post.author), el("div", "time", formatTime(post.created_at)));
      head.append(el("div", "avatar", post.author.slice(0, 1)), who, el("button", "more", "···"));
      card.append(head, renderPhotos(post.images));

      const content = el("p", "content", post.content);
      card.append(content);

      // 긴 글은 3줄까지 보여주고 '더 보기'
      requestAnimationFrame(() => {
        content.classList.add("clamped");
        if (content.scrollHeight > content.clientHeight + 1) {
          const btn = el("button", "read-more", "더 보기");
          btn.type = "button";
          btn.addEventListener("click", () => {
            const open = content.classList.toggle("clamped");
            btn.textContent = open ? "더 보기" : "접기";
          });
          card.append(btn);
        } else {
          content.classList.remove("clamped");
        }
      });

      return card;
    }

    const feed = document.getElementById("feed");
    posts.forEach((post) => feed.append(renderCard(post)));
  </script>
</body>
</html>
